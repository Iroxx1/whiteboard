name: Whisper image

# Builds the speech-to-text server image (infra/docker/whisper.Dockerfile). Only needed when that
# file changes; the compose file pins the result by digest.
on:
  push:
    branches: [main]
    paths:
      - infra/docker/whisper.Dockerfile
      - .github/workflows/whisper-image.yml
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/whiteboard-whisper
          tags: |
            type=raw,value=v1.9.5
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/whisper.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
